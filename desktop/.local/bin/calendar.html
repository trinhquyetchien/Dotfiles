      function closeRecurringConfirm() {
        const modal = document.getElementById("recurring-confirm-modal");
        if (modal) modal.style.display = "none";
        if (pendingRecurringAction && (pendingRecurringAction.action === "drag" || pendingRecurringAction.action === "resize")) {
          renderCalendar();
        }
        pendingRecurringAction = null;
      }

      function confirmRecurringChoice(mode) {
        if (!pendingRecurringAction) return;
        const config = pendingRecurringAction;
        const ev = config.ev;
        const occDate = config.occurrenceDate;
        const action = config.action;

        if (action === "delete") {
          if (mode === 1) {
            if (!ev.exceptionDates) ev.exceptionDates = [];
            if (occDate && !ev.exceptionDates.includes(occDate)) {
              ev.exceptionDates.push(occDate);
            }
          } else if (mode === 2) {
            if (occDate) {
              if (occDate <= ev.start.substring(0, 10)) {
                events = events.filter((e) => e.id !== ev.id);
              } else {
                ev.untilDate = occDate;
              }
            }
          } else if (mode === 3) {
            events = events.filter((e) => e.id !== ev.id);
          }
        } else if (action === "edit") {
          const newValues = config.newValues;
          if (mode === 1) {
            if (!ev.exceptionDates) ev.exceptionDates = [];
            if (occDate && !ev.exceptionDates.includes(occDate)) {
              ev.exceptionDates.push(occDate);
            }
            const singleEv = {
              id: Date.now().toString(),
              title: newValues.title,
              note: newValues.note,
              color: newValues.color,
              start: newValues.start,
              end: newValues.end,
              repeatDays: []
            };
            events.push(singleEv);
          } else if (mode === 2) {
            const origAnchorDate = ev.start.substring(0, 10);
            if (occDate <= origAnchorDate && newValues.dateStr === origAnchorDate) {
              ev.title = newValues.title;
              ev.note = newValues.note;
              ev.color = newValues.color;
              ev.start = newValues.start;
              ev.end = newValues.end;
              ev.repeatDays = newValues.repeatDays;
            } else {
              const oldUntilDate = ev.untilDate;
              ev.untilDate = occDate;
              const futureExceptions = (ev.exceptionDates || []).filter(d => d >= occDate);
              ev.exceptionDates = (ev.exceptionDates || []).filter(d => d < occDate);

              const newRecurringEv = {
                id: Date.now().toString(),
                title: newValues.title,
                note: newValues.note,
                color: newValues.color,
                start: newValues.start,
                end: newValues.end,
                repeatDays: newValues.repeatDays,
                exceptionDates: futureExceptions,
                untilDate: (oldUntilDate && oldUntilDate > occDate) ? oldUntilDate : undefined
              };
              events.push(newRecurringEv);
            }
          } else if (mode === 3) {
            ev.title = newValues.title;
            ev.note = newValues.note;
            ev.color = newValues.color;
            ev.repeatDays = newValues.repeatDays;

            if (!newValues.repeatDays || newValues.repeatDays.length === 0) {
              ev.repeatDays = [];
              ev.start = newValues.start;
              ev.end = newValues.end;
              delete ev.exceptionDates;
              delete ev.untilDate;
            } else {
              const origAnchorDate = ev.start.substring(0, 10);
              let dayOffset = 0;
              if (newValues.dateStr && occDate) {
                const d1 = new Date(occDate + "T00:00:00");
                const d2 = new Date(newValues.dateStr + "T00:00:00");
                dayOffset = Math.round((d2 - d1) / 86400000);
              }

              const anchorStart = new Date(origAnchorDate + "T" + newValues.startTime + ":00");
              if (dayOffset !== 0) {
                anchorStart.setDate(anchorStart.getDate() + dayOffset);
              }

              let anchorEnd = new Date(formatDateYMD(anchorStart) + "T" + newValues.endTime + ":00");
              if (anchorEnd <= anchorStart) {
                if (newValues.startTime === newValues.endTime) {
                  anchorEnd = new Date(anchorStart.getTime() + 30 * 60000);
                } else {
                  anchorEnd.setDate(anchorEnd.getDate() + 1);
                }
              }

              ev.start = formatDateYMD(anchorStart) + "T" + String(anchorStart.getHours()).padStart(2, '0') + ":" + String(anchorStart.getMinutes()).padStart(2, '0') + ":00";
              ev.end = formatDateYMD(anchorEnd) + "T" + String(anchorEnd.getHours()).padStart(2, '0') + ":" + String(anchorEnd.getMinutes()).padStart(2, '0') + ":00";
            }
          }
        } else if (action === "drag") {
          const targetDate = config.targetDate;
          const newStartStr = config.newStartStr;
          const newEndStr = config.newEndStr;
          const newStartTime = config.newStartTime;
          const sourceDay = new Date(occDate + "T00:00:00").getDay();
          const targetDay = new Date(targetDate + "T00:00:00").getDay();
          const deltaDay = (targetDay - sourceDay + 7) % 7;

          if (mode === 1) {
            if (!ev.exceptionDates) ev.exceptionDates = [];
            if (occDate && !ev.exceptionDates.includes(occDate)) {
              ev.exceptionDates.push(occDate);
            }
            const singleEv = {
              id: Date.now().toString(),
              title: ev.title,
              note: ev.note || "",
              color: ev.color || "#0a84ff",
              start: newStartStr,
              end: newEndStr,
              repeatDays: []
            };
            events.push(singleEv);
          } else if (mode === 2) {
            const origAnchorDate = ev.start.substring(0, 10);
            let shiftedRepeatDays = [...ev.repeatDays];
            if (deltaDay !== 0) {
              shiftedRepeatDays = ev.repeatDays.map(d => (d === sourceDay ? targetDay : d));
              shiftedRepeatDays = Array.from(new Set(shiftedRepeatDays)).sort();
            }
            if (occDate <= origAnchorDate && targetDate === origAnchorDate) {
              ev.start = newStartStr;
              ev.end = newEndStr;
              ev.repeatDays = shiftedRepeatDays;
            } else {
              const oldUntilDate = ev.untilDate;
              ev.untilDate = occDate;
              const futureExceptions = (ev.exceptionDates || []).filter(d => d >= occDate);
              ev.exceptionDates = (ev.exceptionDates || []).filter(d => d < occDate);

              const newRecurringEv = {
                id: Date.now().toString(),
                title: ev.title,
                note: ev.note || "",
                color: ev.color || "#0a84ff",
                start: newStartStr,
                end: newEndStr,
                repeatDays: shiftedRepeatDays,
                exceptionDates: futureExceptions,
                untilDate: (oldUntilDate && oldUntilDate > occDate) ? oldUntilDate : undefined
              };
              events.push(newRecurringEv);
            }
          } else if (mode === 3) {
            if (deltaDay !== 0) {
              ev.repeatDays = ev.repeatDays.map(d => (d === sourceDay ? targetDay : d));
              ev.repeatDays = Array.from(new Set(ev.repeatDays)).sort();
            }
            const origAnchorDate = ev.start.substring(0, 10);
            const anchorStart = new Date(origAnchorDate + "T" + newStartTime + ":00");
            const durationMs = new Date(newEndStr) - new Date(newStartStr);
            const anchorEnd = new Date(anchorStart.getTime() + durationMs);
            ev.start = formatDateYMD(anchorStart) + "T" + String(anchorStart.getHours()).padStart(2, '0') + ":" + String(anchorStart.getMinutes()).padStart(2, '0') + ":00";
            ev.end = formatDateYMD(anchorEnd) + "T" + String(anchorEnd.getHours()).padStart(2, '0') + ":" + String(anchorEnd.getMinutes()).padStart(2, '0') + ":00";
          }
        } else if (action === "resize") {
          const newDurationMs = config.newDurationMs;
          const occStart = new Date(occDate + "T" + ev.start.substring(11, 16) + ":00");
          const occEnd = new Date(occStart.getTime() + newDurationMs);
          const occEndStr = formatDateYMD(occEnd) + "T" + String(occEnd.getHours()).padStart(2, '0') + ":" + String(occEnd.getMinutes()).padStart(2, '0') + ":00";

          if (mode === 1) {
            if (!ev.exceptionDates) ev.exceptionDates = [];
            if (occDate && !ev.exceptionDates.includes(occDate)) {
              ev.exceptionDates.push(occDate);
            }
            const singleEv = {
              id: Date.now().toString(),
              title: ev.title,
              note: ev.note || "",
              color: ev.color || "#0a84ff",
              start: formatDateYMD(occStart) + "T" + ev.start.substring(11, 16) + ":00",
              end: occEndStr,
              repeatDays: []
            };
            events.push(singleEv);
          } else if (mode === 2) {
            const origAnchorDate = ev.start.substring(0, 10);
            const anchorStart = new Date(ev.start);
            const anchorEnd = new Date(anchorStart.getTime() + newDurationMs);
            const anchorEndStr = formatDateYMD(anchorEnd) + "T" + String(anchorEnd.getHours()).padStart(2, '0') + ":" + String(anchorEnd.getMinutes()).padStart(2, '0') + ":00";

            if (occDate <= origAnchorDate) {
              ev.end = anchorEndStr;
            } else {
              const oldUntilDate = ev.untilDate;
              ev.untilDate = occDate;
              const futureExceptions = (ev.exceptionDates || []).filter(d => d >= occDate);
              ev.exceptionDates = (ev.exceptionDates || []).filter(d => d < occDate);

              const newRecurringEv = {
                id: Date.now().toString(),
                title: ev.title,
                note: ev.note || "",
                color: ev.color || "#0a84ff",
                start: formatDateYMD(occStart) + "T" + ev.start.substring(11, 16) + ":00",
                end: occEndStr,
                repeatDays: [...ev.repeatDays],
                exceptionDates: futureExceptions,
                untilDate: (oldUntilDate && oldUntilDate > occDate) ? oldUntilDate : undefined
              };
              events.push(newRecurringEv);
            }
          } else if (mode === 3) {
            const anchorStart = new Date(ev.start);
            const anchorEnd = new Date(anchorStart.getTime() + newDurationMs);
            ev.end = formatDateYMD(anchorEnd) + "T" + String(anchorEnd.getHours()).padStart(2, '0') + ":" + String(anchorEnd.getMinutes()).padStart(2, '0') + ":00";
          }
        } else if (action === "duplicate") {
          const newValues = config.newValues;
          if (mode === 1) {
            const singleEv = {
              id: Date.now().toString(),
              title: newValues.title,
              note: newValues.note,
              color: newValues.color,
              start: newValues.start,
              end: newValues.end,
              repeatDays: []
            };
            events.push(singleEv);
          } else if (mode === 2) {
            const newRecurringEv = {
              id: Date.now().toString(),
              title: newValues.title,
              note: newValues.note,
              color: newValues.color,
              start: newValues.start,
              end: newValues.end,
              repeatDays: [...newValues.repeatDays],
              untilDate: ev.untilDate
            };
            events.push(newRecurringEv);
          } else if (mode === 3) {
            const origAnchorDate = ev.start.substring(0, 10);
            const anchorStart = new Date(origAnchorDate + "T" + newValues.startTime + ":00");
            const anchorEnd = new Date(origAnchorDate + "T" + newValues.endTime + ":00");
            if (anchorEnd <= anchorStart) {
              anchorEnd.setDate(anchorEnd.getDate() + 1);
            }
            const newRecurringEv = {
              id: Date.now().toString(),
              title: newValues.title,
              note: newValues.note,
              color: newValues.color,
              start: formatDateYMD(anchorStart) + "T" + String(anchorStart.getHours()).padStart(2, '0') + ":" + String(anchorStart.getMinutes()).padStart(2, '0') + ":00",
              end: formatDateYMD(anchorEnd) + "T" + String(anchorEnd.getHours()).padStart(2, '0') + ":" + String(anchorEnd.getMinutes()).padStart(2, '0') + ":00",
              repeatDays: [...newValues.repeatDays],
              untilDate: ev.untilDate
            };
            events.push(newRecurringEv);
          }
        }

        closeRecurringConfirm();
        saveEvents();
      }

      function closeModal() {
        document.getElementById("modal").style.display = "none";
      }

      function duplicateEvent(ev, dateStr) {
        if (!ev) return;
        const occDate = dateStr || ev.start.substring(0, 10);
        const startTime = ev.start.substring(11, 16);
        const endTime = ev.end.substring(11, 16);
        const occStartStr = occDate + "T" + startTime + ":00";
        const occStart = new Date(occStartStr);
        const origStart = new Date(ev.start);
        const origEnd = new Date(ev.end);
        const durationMs = origEnd.getTime() - origStart.getTime();
        const occEnd = new Date(occStart.getTime() + durationMs);
        const occEndStr = formatDateYMD(occEnd) + "T" + String(occEnd.getHours()).padStart(2, '0') + ":" + String(occEnd.getMinutes()).padStart(2, '0') + ":00";

        if (ev.repeatDays && ev.repeatDays.length > 0) {
          openRecurringConfirm({
            action: "duplicate",
            ev: ev,
            occurrenceDate: occDate,
            newValues: {
              title: ev.title,
              note: ev.note || "",
              color: ev.color || "#0a84ff",
              dateStr: occDate,
              startTime: startTime,
              endTime: endTime,
              start: occStartStr,
              end: occEndStr,
              repeatDays: ev.repeatDays
            }
          });
        } else {
          const newEv = {
            id: Date.now().toString(),
            title: ev.title,
            note: ev.note || "",
            color: ev.color || "#0a84ff",
            start: occStartStr,
            end: occEndStr,
            repeatDays: []
          };
          events.push(newEv);
          saveEvents();
        }
      }

      function duplicateModal() {
        if (!currentEventId) return;

        const title = document.getElementById("ev-title").value || "Untitled";
        const note = document.getElementById("ev-note").value;
        const color = document.getElementById("ev-color").value;

        const dateStr = document.getElementById("ev-date").value || document.getElementById("ev-start").dataset.date || formatDateYMD(new Date());
        const endDateStr = document.getElementById("ev-end-date").value || dateStr;
        const startTime = document.getElementById("ev-start").value || "00:00";
        const endTime = document.getElementById("ev-end").value || "00:30";

        const checkboxes = document.querySelectorAll('#ev-repeat input[type="checkbox"]:checked');
        const repeatDays = Array.from(checkboxes).map(cb => parseInt(cb.value));

        let startDate = new Date(dateStr + "T" + startTime + ":00");
        let endDate = new Date(endDateStr + "T" + endTime + ":00");

        if (endDate <= startDate) {
           if (startTime === endTime && dateStr === endDateStr) {
               endDate = new Date(startDate.getTime() + 30 * 60000);
           } else if (dateStr === endDateStr) {
               endDate.setDate(endDate.getDate() + 1);
           } else {
               endDate = new Date(startDate.getTime() + 30 * 60000);
           }
        }

        const newStartStr = formatDateYMD(startDate) + "T" + String(startDate.getHours()).padStart(2, '0') + ":" + String(startDate.getMinutes()).padStart(2, '0') + ":00";
        const newEndStr = formatDateYMD(endDate) + "T" + String(endDate.getHours()).padStart(2, '0') + ":" + String(endDate.getMinutes()).padStart(2, '0') + ":00";

        const ev = events.find((e) => e.id === currentEventId);
        if (!ev) {
          closeModal();
          return;
        }

        const isRecurring = originalEditingEvent && originalEditingEvent.repeatDays && originalEditingEvent.repeatDays.length > 0;

        if (isRecurring && repeatDays.length > 0) {
          closeModal();
          openRecurringConfirm({
            action: "duplicate",
            ev: ev,
            originalEvent: originalEditingEvent,
            occurrenceDate: originalEditingOccurrenceDate,
            newValues: {
              title: title,
              note: note,
              color: color,
              dateStr: dateStr,
              endDateStr: endDateStr,
              startTime: startTime,
              endTime: endTime,
              start: newStartStr,
              end: newEndStr,
              repeatDays: repeatDays
            }
          });
          return;
        }

        const duplicateEv = {
          id: Date.now().toString(),
          title: title,
          note: note,
          color: color,
          start: newStartStr,
          end: newEndStr,
          repeatDays: repeatDays
        };

        events.push(duplicateEv);
        closeModal();
        saveEvents();
      }

      function saveModal() {
        const title = document.getElementById("ev-title").value || "Untitled";
        const note = document.getElementById("ev-note").value;
        const color = document.getElementById("ev-color").value;

        const dateStr = document.getElementById("ev-date").value || document.getElementById("ev-start").dataset.date || formatDateYMD(new Date());
        const endDateStr = document.getElementById("ev-end-date").value || dateStr;
        const startTime = document.getElementById("ev-start").value || "00:00";
        const endTime = document.getElementById("ev-end").value || "00:30";

        const checkboxes = document.querySelectorAll('#ev-repeat input[type="checkbox"]:checked');
        const repeatDays = Array.from(checkboxes).map(cb => parseInt(cb.value));

        let startDate = new Date(dateStr + "T" + startTime + ":00");
        let endDate = new Date(endDateStr + "T" + endTime + ":00");

        if (endDate <= startDate) {
           if (startTime === endTime && dateStr === endDateStr) {
               endDate = new Date(startDate.getTime() + 30 * 60000);
           } else if (dateStr === endDateStr) {
               endDate.setDate(endDate.getDate() + 1);
           } else {
               endDate = new Date(startDate.getTime() + 30 * 60000);
           }
        }

        const newStartStr = formatDateYMD(startDate) + "T" + String(startDate.getHours()).padStart(2, '0') + ":" + String(startDate.getMinutes()).padStart(2, '0') + ":00";
        const newEndStr = formatDateYMD(endDate) + "T" + String(endDate.getHours()).padStart(2, '0') + ":" + String(endDate.getMinutes()).padStart(2, '0') + ":00";

        if (!currentEventId) {
          const newEv = {
            id: Date.now().toString(),
            title: title,
            note: note,
            color: color,
            start: newStartStr,
            end: newEndStr,
            repeatDays: repeatDays
          };
          events.push(newEv);
          closeModal();
          saveEvents();
          return;
        }

        const ev = events.find((e) => e.id === currentEventId);
        if (!ev) {
          closeModal();
          return;
        }

        const isRecurring = originalEditingEvent && originalEditingEvent.repeatDays && originalEditingEvent.repeatDays.length > 0;

        if (isRecurring) {
          const origStartTime = originalEditingEvent.start.substring(11, 16);
          const origEndTime = originalEditingEvent.end.substring(11, 16);
          const origRepeat = [...(originalEditingEvent.repeatDays || [])].sort().join(',');
          const newRepeat = [...repeatDays].sort().join(',');
          const origOccurrenceEndDate = originalEditingOccurrenceEndDate || originalEditingOccurrenceDate;

          const hasChanged = 
            title !== originalEditingEvent.title ||
            (note || "") !== (originalEditingEvent.note || "") ||
            (color || "#0a84ff") !== (originalEditingEvent.color || "#0a84ff") ||
            dateStr !== originalEditingOccurrenceDate ||
            endDateStr !== origOccurrenceEndDate ||
            startTime !== origStartTime ||
            endTime !== origEndTime ||
            origRepeat !== newRepeat;

          if (!hasChanged) {
            closeModal();
            return;
          }

          closeModal();
          openRecurringConfirm({
            action: "edit",
            ev: ev,
            originalEvent: originalEditingEvent,
            occurrenceDate: originalEditingOccurrenceDate,
            newValues: {
              title: title,
              note: note,
              color: color,
              dateStr: dateStr,
              endDateStr: endDateStr,
              startTime: startTime,
              endTime: endTime,
              start: newStartStr,
              end: newEndStr,
              repeatDays: repeatDays
            }
          });
          return;
        }

        ev.title = title;
        ev.note = note;
        ev.color = color;
        ev.start = newStartStr;
        ev.end = newEndStr;
        ev.repeatDays = repeatDays;

        closeModal();
        saveEvents();
      }

      function saveEvents() {
        renderCalendar();
        sendToPython("save_events", events);
      }

      setInterval(updateCurrentTimeLine, 60000);
    </script>
