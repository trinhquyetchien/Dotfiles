<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="45%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="33.5" y="33.5" width="445" height="445" rx="102.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.22" />

  <!-- Note/Calendar Backdrop Card -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.18" />

  <!-- Top Note Accent: Calendar / Window Binder Dots -->
  <circle cx="118" cy="116" r="6" fill="#f87171" opacity="0.85" />
  <circle cx="140" cy="116" r="6" fill="#fbbf24" opacity="0.85" />
  <circle cx="162" cy="116" r="6" fill="#34d399" opacity="0.85" />
  <line x1="100" y1="140" x2="412" y2="140" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.18" />

  <!-- Markdown 'M' Logo -->
  <path d="M 120,328 V 185 h 36 l 42,54 l 42,-54 h 36 v 143 h -32 v -84 l -46,58 h -16 l -46,-58 v 84 Z" fill="#ffffff" />

  <!-- Markdown Downward Arrow -->
  <path d="M 314,222 v 55 h -20 l 32,42 l 32,-42 h -20 v -55 Z" fill="#ffffff" />

  <!-- Task Completed Badge (Bottom Right) -->
  <g filter="url(#badgeShadow)">
    <circle cx="372" cy="372" r="56" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="4.5" />
    <path d="M 349,372 l 16,16 l 35,-35" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>