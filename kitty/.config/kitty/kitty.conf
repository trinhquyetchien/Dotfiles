# vim:fileencoding=utf-8:ft=kitty

# ==============================================================================
# Font Configuration
# ==============================================================================
font_family      JetBrains Mono Medium
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Line height equivalent to wezterm's line_height = 1.2
modify_font cell_height 120%

# Disable missing glyph warning
symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 PowerlineSymbols

# ==============================================================================
# Cursor
# ==============================================================================
cursor_shape block
cursor_blink_interval 0.5

# ==============================================================================
# Window and Padding
# ==============================================================================
# window_padding_width <top/bottom> <left/right>
window_padding_width 0 2
background_opacity 0.8

# hide_window_decorations yes is similar to window_decorations = "RESIZE" in wezterm
hide_window_decorations yes
# allow dynamic opacity changing
dynamic_background_opacity yes

# ==============================================================================
# Tab Bar
# ==============================================================================
# Wezterm config.enable_tab_bar = false
tab_bar_style hidden

# Tab bar colors matching your wezterm configuration
active_tab_foreground   #DCD7BA
active_tab_background   #181616
inactive_tab_foreground #727169
inactive_tab_background #181616
tab_bar_background      #181616

# ==============================================================================
# Shell
# ==============================================================================
shell /bin/zsh -l


# ==============================================================================
# Theme (Kanagawa Dragon)
# ==============================================================================
include kanagawa-dragon.conf

# ==============================================================================
# Keybindings
# ==============================================================================
# --- Opacity controls ---
# CTRL+SHIFT+UpArrow : opacity up
map ctrl+shift+up set_background_opacity +0.05
# CTRL+SHIFT+DownArrow : opacity down
map ctrl+shift+down set_background_opacity -0.05
# CTRL+SHIFT+Space : opacity reset
map ctrl+shift+space set_background_opacity 0.8

# --- Fullscreen ---
map ctrl+shift+enter toggle_fullscreen

# --- Clipboard ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# --- Tab Management ---
# Create tab
map ctrl+shift+t new_tab
# Close tab
map ctrl+shift+w close_tab
# Rename tab
map ctrl+shift+r set_tab_title
# Previous tab
map alt+h previous_tab
# Next tab
map alt+l next_tab

# Show tab navigator (select_tab in kitty)
map ctrl+shift+p select_tab

# Toggle tab bar (Workaround: cycle tab_bar_style between hidden and separator)
# Not natively supported as a toggle like wezterm, but can be done by mapping to multiple styles
# However, mapping to set_tab_bar_style is possible in newer kitty versions.
# We map it to toggle between hidden and normal:
map ctrl+shift+b toggle_tab_bar
