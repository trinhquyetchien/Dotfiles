# GNOME Wayland handles 3-finger swipes natively (workspace switching & overview), so they are commented out here to avoid conflicts.
# gesture swipe left   3 ydotool key alt+tab
# gesture swipe right  3 ydotool key alt+tab
# gesture swipe up     3 ydotool key super
# gesture swipe down   3 ydotool key super 

# Changed to 4 fingers for alt+tab
# gesture swipe left   4 ydotool key alt+tab
# gesture swipe right  4 ydotool key alt+tab
# gesture swipe down   4 ydotool key ctrl+alt+t
# gesture swipe up     4 google-chrome

# gesture pinch in    2 ydotool key ctrl+minus
# gesture pinch out   2 ydotool key ctrl+equal

# gesture swipe left  2 ydotool key ctrl+t
